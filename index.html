<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F5D24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUX Athletes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>BUX ATHLETES</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --card:#1c2430; --card2:#232d3b;
  --line:#2b3542; --txt:#eef2f6; --dim:#9aa7b4; --dim2:#6b7684;
  --gold:#F1C93B; --green:#1F5D24; --green2:#2f9e44; --sky:#38bdf8; --rose:#fb7185; --run:#34d399;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  direction:ltr; text-align:left;
}
input,textarea,button,select{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.hdr .title{font-size:19px;font-weight:900;letter-spacing:.02em}
.hdr .title b{color:var(--gold)} .hdr .title span{color:var(--green2)}
.hdr .sub{font-size:12.5px;color:var(--dim);font-weight:700}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .mark img{width:100%;height:100%;object-fit:contain}
.brand .mark svg{width:44px;height:44px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:800;font-size:14px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px}
.b-strength{background:rgba(241,201,59,.16);color:var(--gold)}
.b-cond{background:rgba(56,189,248,.16);color:var(--sky)}
.b-cf{background:rgba(251,113,133,.16);color:var(--rose)}
.b-run{background:rgba(52,211,153,.16);color:var(--run)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.d-strength{background:var(--gold)} .d-cond{background:var(--sky)} .d-cf{background:var(--rose)} .d-run{background:var(--run)}

.wtitle{font-size:26px;font-weight:800;margin:10px 0 4px;text-align:left}
.wsub{color:var(--dim);font-size:14px;font-weight:600;line-height:1.5;text-align:left}
.ex .en,.ex .rx,.fld small,.setrow .hc,.detail-ex .dn,.detail-ex .dl,.stat .k,.stat .v,.sheet h3{text-align:left}
input.in{text-align:left;direction:ltr}
.wnum{font-size:14px;font-weight:800;color:var(--dim)}
.rx b.calc{color:var(--run);font-weight:800;background:rgba(52,211,153,.12);padding:1px 6px;border-radius:6px;white-space:nowrap}

/* exercise */
.ex{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.ex .en{font-size:17px;font-weight:800;margin-bottom:3px}
.ex .num{color:var(--dim);font-weight:800;margin-inline-end:5px}
.ex .rx{color:var(--gold);font-size:14.5px;font-weight:600;white-space:pre-line;margin-bottom:9px;opacity:.95}
.ex.warm .rx{color:var(--dim)}
.setrow{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:7px;align-items:center;margin-bottom:7px}
.setrow .lbl{grid-column:1/-1;font-size:12px;color:var(--dim);font-weight:700;margin-bottom:-2px}
.setrow .hc{font-size:11.5px;color:var(--dim);font-weight:700;padding:0 2px 1px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld small{font-size:11px;color:var(--dim);font-weight:700}
input.in,textarea.in{
  background:var(--bg2);border:1.5px solid var(--line);border-radius:11px;
  color:var(--txt);padding:12px 11px;font-size:16px;font-weight:700;width:100%;outline:none;
}
input.in:focus,textarea.in:focus{border-color:var(--gold)}
textarea.in{font-weight:600;line-height:1.5;resize:vertical;min-height:96px}
.copybtn{background:var(--bg2);border:1.5px solid var(--line);border-radius:11px;padding:0 12px;height:46px;color:var(--dim);font-weight:800;font-size:19px}
.copybtn:active{background:var(--card)}
.setidx{align-self:center;font-weight:800;color:var(--dim);font-size:14px}
.exbtns{display:flex;gap:8px;margin-top:4px}
.minibtn{font-size:13px;font-weight:800;color:var(--dim);background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.minibtn:active{background:var(--card)}

/* endurance / cf blocks */
.planrow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.planrow:last-child{border-bottom:none}
.planrow .ps{font-weight:800;color:var(--dim);min-width:26px}
.planrow .pe{font-weight:800;flex:1}
.planrow .pl{color:var(--gold);font-weight:600;text-align:end;white-space:pre-line}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}

/* big finish */
.finish{
  width:100%;background:linear-gradient(135deg,#2f9e44,#37b24d);color:#fff;
  font-size:20px;font-weight:800;padding:19px;border-radius:16px;margin:6px 0 4px;
  box-shadow:0 8px 22px rgba(47,158,68,.4);
}
.finish:active{transform:scale(.985)}
.finish.disabled{background:var(--card2);color:var(--dim);box-shadow:none}
.undo{width:100%;background:var(--card);border:1px solid var(--line);color:var(--dim);font-weight:800;padding:13px;border-radius:14px;font-size:15px}

/* cf hero */
.hero{text-align:center;padding:26px 16px}
.hero .emoji{font-size:64px;line-height:1}
.hero .big{font-size:28px;font-weight:800;margin:14px 0 6px}
.hero .small{color:var(--dim);font-size:15px;font-weight:600}

/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(13,17,23,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;color:var(--dim);font-size:11.5px;font-weight:800;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--gold)}
.tab.on svg{stroke:var(--gold)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead button{font-size:26px;font-weight:800;color:var(--dim);padding:4px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.calhead .m{font-size:19px;font-weight:800}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dow div{text-align:center;color:var(--dim);font-size:12px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;font-weight:700;font-size:15px}
.cell.empty{background:transparent;border:none}
.cell.today{border-color:var(--gold)}
.cell.has{cursor:pointer}
.cell .dots{display:flex;gap:2px;position:absolute;bottom:6px}
.cell .n{opacity:.85}

/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .k{color:var(--dim);font-size:12.5px;font-weight:800}
.stat .v{font-size:23px;font-weight:800;margin-top:3px}
.stat .u{font-size:13px;color:var(--dim);font-weight:700}
.seg{display:flex;gap:6px;margin:2px 0 14px;background:var(--bg2);padding:5px;border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--gold);color:#1a1a1a}
.chartwrap{overflow-x:auto}
.counts{display:flex;gap:10px}
.counts .c{flex:1;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px}
.counts .c .cv{font-size:24px;font-weight:800}
.counts .c .cl{font-size:12px;color:var(--dim);font-weight:800;margin-top:2px}

.settingsbtn{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:800;padding:14px;border-radius:14px;font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;margin-bottom:4px}
.sheet .close{position:absolute;top:14px;left:16px;font-size:22px;color:var(--dim);background:var(--card);width:38px;height:38px;border-radius:50%}
.confirm{max-width:340px;margin:auto;border-radius:20px;align-self:center}
.overlay.center{align-items:center;padding:20px}
.cbtns{display:flex;gap:10px;margin-top:16px}
.cbtns button{flex:1;padding:14px;border-radius:13px;font-weight:800;font-size:16px}
.cbtns .yes{background:var(--green);color:#fff}
.cbtns .no{background:var(--card);border:1px solid var(--line);color:var(--dim)}
.detail-ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.detail-ex .dn{font-weight:800;margin-bottom:3px}
.detail-ex .dl{font-size:14px;color:var(--dim);white-space:pre-line}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:14px 0 4px}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<canvas class="confetti hidden" id="confetti"></canvas>

<!-- tabs -->
<nav class="tabs">
  <button class="tab on" data-tab="workout" onclick="go('workout')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M4 8l-1 1 3 3M20 16l1-1-3-3M8 4l-1 1M16 20l1-1"/><path d="M2 12h4M18 12h4"/></svg>
    אימון
  </button>
  <button class="tab" data-tab="calendar" onclick="go('calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    לוח שנה
  </button>
  <button class="tab" data-tab="stats" onclick="go('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    סטטיסטיקות
  </button>
</nav>

<!-- overlays -->
<div class="overlay center" id="confirmOv">
  <div class="sheet confirm card" style="margin:auto">
    <h3 id="confirmTitle">לסיים את האימון?</h3>
    <p style="color:var(--dim);font-size:14px;margin:8px 0 0" id="confirmMsg">האימון יישמר עם תאריך היום ותעבור לאימון הבא.</p>
    <div class="cbtns">
      <button class="no" onclick="closeConfirm()">ביטול</button>
      <button class="yes" id="confirmYes">אישור</button>
    </div>
  </div>
</div>
<div class="overlay" id="sheetOv" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheetBody"></div>
</div>

<script>
/* ---------- state ---------- */
const KEY='wl101_tracker_v1';
const DEFAULT={strengthIdx:0,condIdx:0,totalDone:0,history:[],draft:{sig:'',data:{}}};
let S=load();
function normalize(s){
  try{
    const sl=(PROGRAMS&&PROGRAMS.strength&&PROGRAMS.strength.length)||1;
    const cl=(PROGRAMS&&PROGRAMS.cond&&PROGRAMS.cond.length)||1;
    s.strengthIdx=((Math.floor(+s.strengthIdx||0)%sl)+sl)%sl;
    s.condIdx=((Math.floor(+s.condIdx||0)%cl)+cl)%cl;
    s.totalDone=Math.max(0,Math.floor(+s.totalDone||0));
    if(!Array.isArray(s.history))s.history=[];
    s.history=s.history.filter(e=>e&&typeof e==='object').map(e=>{if(!e.data||typeof e.data!=='object')e.data={};if(!e.type)e.type='strength';return e;});
    if(!s.draft||typeof s.draft!=='object')s.draft={sig:'',data:{}};
    if(!s.draft.data||typeof s.draft.data!=='object')s.draft.data={};
    if(typeof s.draft.sig!=='string')s.draft.sig='';
  }catch(e){}
  return s;
}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return normalize(Object.assign({},DEFAULT,r));}catch(e){}return normalize(JSON.parse(JSON.stringify(DEFAULT)));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast&&toast('שגיאת שמירה — בדוק מקום פנוי');}}

/* ---------- date helpers ---------- */
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOW=['א','ב','ג','ד','ה','ו','ש'];
function pad(n){return n<10?'0'+n:''+n;}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return keyOf(new Date());}
function parseKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function weekStartKey(k){const d=parseKey(k);d.setDate(d.getDate()-d.getDay());return keyOf(d);} // Sunday
function fmtDate(k){const d=parseKey(k);return d.getDate()+' ב'+MONTHS[d.getMonth()];}

/* ---------- cycle logic ---------- */
// fixed 10-workout cycle, repeats forever
const CYCLE=['strength','strength','cond','strength','crossfit','strength','strength','run','strength','crossfit'];
function nextWorkout(){
  const step=S.totalDone%CYCLE.length;
  const type=CYCLE[step];
  if(type==='strength'){
    let i=S.strengthIdx; if(!PROGRAMS.strength[i]){i=0;S.strengthIdx=0;}
    return {type:'strength',def:PROGRAMS.strength[i],sig:'st'+i,step};
  }
  if(type==='cond'){
    let i=S.condIdx; if(!PROGRAMS.cond[i]){i=0;S.condIdx=0;}
    return {type:'cond',def:PROGRAMS.cond[i],sig:'cn'+i,step};
  }
  if(type==='run') return {type:'run',def:null,sig:'rn'+S.totalDone,step};
  return {type:'crossfit',def:null,sig:'cf'+S.totalDone,step};
}
const TYPE_HE={strength:'הרמת משקולות',cond:'סיבולת',crossfit:'קרוספיט',run:'ריצה'};

/* ---------- 1RM maxes → auto-computed target loads ---------- */
// EDIT HERE: Gal's personal maxes in kg (0 = unknown, app just shows the %)
const MAXES={
  snatch:90,        // Squat Snatch  (סקוואט סנאץ׳)
  powerSnatch:80,   // Power Snatch  (פאוור סנאץ׳)
  cleanJerk:120,    // Clean & Jerk  (קלין אנד ג׳רק)
  powerClean:125,   // Power Clean   (פאוור קלין)
  pushPress:110,    // Push Press    (פוש פרס)
  frontSquat:130,   // Front Squat   (פרונט סקוואט)
  backSquat:150,    // Back Squat    (בק סקוואט)
  deadlift:0,       // Deadlift      (דדליפט) — עדיין חסר, ממתין למספר של גל
  bench:95,         // Bench Press   (בנץ׳ פרס)
  weightedPullup:24 // Weighted Pull-up (מתח עם משקל)
};
const LIFT_MAP=[
  [/squat snatch/i,'snatch'],
  [/power snatch/i,'powerSnatch'],
  [/clean\s*&\s*jerk|clean and jerk/i,'cleanJerk'],
  [/power clean/i,'powerClean'],
  [/push press/i,'pushPress'],
  [/front squat/i,'frontSquat'],
  [/back squat/i,'backSquat'],
  [/deadlift/i,'deadlift'],
  [/bench press/i,'bench'],
  [/weighted pull-?up/i,'weightedPullup']
];
function roundKg(x){return Math.round(x*2)/2;}
// annotate rx lines with computed kg; return {html:[...], prefill:firstKg|''}
function computeLoads(rxLines){
  let prefill='';
  const html=(rxLines||[]).map(line=>{
    return (''+line).replace(/(\d+(?:[.,]\d+)?)\s*%\s*of your\s+1RM\s+([a-z][a-z &\-]*)/ig,(m,pct,lift)=>{
      let key=null;
      for(const p of LIFT_MAP){ if(p[0].test(lift)){key=p[1];break;} }
      if(key && MAXES[key]>0){
        const kg=roundKg(parseFloat((''+pct).replace(',','.'))/100*MAXES[key]);
        if(prefill==='')prefill=kg;
        return m+' <b class="calc">= '+kg+' ק״ג</b>';
      }
      return m;
    });
  });
  return {html, prefill};
}

/* ---------- draft ---------- */
function draftFor(sig){
  if(S.draft.sig!==sig){S.draft={sig,data:{}};save();}
  return S.draft.data;
}
function setField(obj,id,val){obj[id]=val;save();}

/* ---------- classify strength exercise ---------- */
function rxText(ex){return (ex.rx||[]).join(' ');}
function isLoggable(ex){
  const t=rxText(ex);
  if(/empty barbell/i.test(t)) return false;
  if(/%|kg|[138]\s?rm|1rm|3rm|8rm|ahafa|max reps|max\b|build|find your/i.test(t)) return true;
  if(/\d+\s*[x×]\s*\d+/i.test(t) && !/unbroken/i.test(t)) return true;
  return false;
}
function plannedSets(ex){
  const t=rxText(ex);
  let m=t.match(/(\d+)\s*[x×]\s*(\d+)/i);
  if(m) return {sets:Math.max(1,Math.min(12,+m[1])),reps:m[2]};
  m=t.match(/(\d+)\s*sets?\b/i);
  if(m) return {sets:Math.max(1,Math.min(12,+m[1])),reps:''};
  return {sets:1,reps:''};
}

/* ---------- rendering ---------- */
let TAB='workout';
const app=document.getElementById('app');
function go(t){TAB=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();window.scrollTo(0,0);}

function render(){
  try{
    if(TAB==='workout')renderWorkout();
    else if(TAB==='calendar')renderCalendar();
    else renderStats();
  }catch(e){
    app.innerHTML='<div class="wrap"><div class="card"><h3>אופס, משהו השתבש</h3>'+
      '<p style="color:var(--dim);font-size:14px;margin:10px 0">אל דאגה — הנתונים שלך שמורים. נסה לרענן, או שחזר גיבוי.</p>'+
      '<button class="settingsbtn" onclick="location.reload()">↻ רענן</button>'+
      '<button class="settingsbtn" onclick="TAB=\'workout\';S.draft={sig:\'\',data:{}};save();location.reload()">נקה טיוטה ורענן</button>'+
      '</div></div>';
    try{console.error(e);}catch(_){}
  }
}

function typeBadge(t){const c={strength:'b-strength',cond:'b-cond',crossfit:'b-cf'}[t];const d={strength:'d-strength',cond:'d-cond',crossfit:'d-cf'}[t];return `<span class="badge ${c}"><span class="dot ${d}"></span>${TYPE_HE[t]}</span>`;}

function renderStrength(nw){
  const w=nw.def, data=draftFor(nw.sig), no=S.totalDone+1;
  let h=`<div class="card">
    ${typeBadge('strength')}
    <div class="wtitle">אימון ${no}</div>
    <div class="wsub">${w.sum||''}</div>
  </div>`;
  w.ex.forEach((ex,ei)=>{
    const log=isLoggable(ex);
    const ps=plannedSets(ex);
    const cl=computeLoads(ex.rx);
    h+=`<div class="ex ${log?'':'warm'}">
      <div class="en"><span class="num">${ex.n}.</span>${ex.name}</div>
      <div class="rx">${cl.html.join('\n')}</div>`;
    if(log){
      const nrows=data['st_'+ei+'_nrows']||ps.sets;
      // pre-fill computed target weight into untouched set-weight fields
      if(cl.prefill!==''){ for(let k=0;k<nrows;k++){ const kk='st_'+ei+'_'+k+'_w'; if(!(kk in data))data[kk]=cl.prefill; } save(); }
      h+=`<div id="sets_${ei}">`;

}
function setRow(ei,k,repsPh,data){

}
function renderCond(nw){

      <div class="fld"><small>קצב ממוצע</small><input class="in" placeholder="למשל 2:00/500מ" data-f="en_pace" value="${esc(data.en_pace||'')}"></div>

function renderExternal(nw,kind){

function renderCF(nw){return renderExternal(nw,'crossfit');}
function renderRun(nw){return renderExternal(nw,'run');}
function finishBtns(nw){

/* ---------- input wiring ---------- */
function esc(s){return (s+'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function wireInputs(nw){
  const data=draftFor(nw.sig);
  app.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',()=>{setField(data,el.dataset.f,el.value);refreshFinish(nw);});
  });
  refreshFinish(nw);
}
function refreshFinish(nw){
  const btn=document.getElementById('finishBtn');if(!btn)return;
  btn.classList.toggle('disabled',!hasAnything(nw));
}
function hasAnything(nw){
  if(nw.type==='crossfit'||nw.type==='run')return true; // done externally, just mark it
  const d=draftFor(nw.sig);
  return Object.keys(d).some(k=>!/nrows/.test(k) && (''+d[k]).trim()!=='');
}

/* ---------- dynamic rows ---------- */
function addSet(ei){const d=S.draft.data;const cur=d['st_'+ei+'_nrows']||plannedSets(nextWorkout().def.ex[ei]).sets;d['st_'+ei+'_nrows']=cur+1;save();renderWorkout();}
function delSet(ei){const d=S.draft.data;const cur=d['st_'+ei+'_nrows']||plannedSets(nextWorkout().def.ex[ei]).sets;if(cur>1){d['st_'+ei+'_nrows']=cur-1;const k=cur-1;delete d['st_'+ei+'_'+k+'_w'];delete d['st_'+ei+'_'+k+'_r'];delete d['st_'+ei+'_'+k+'_n'];save();renderWorkout();}}
function copyPrev(ei,k){if(k<1)return;const d=S.draft.data;d['st_'+ei+'_'+k+'_w']=d['st_'+ei+'_'+(k-1)+'_w']||'';d['st_'+ei+'_'+k+'_r']=d['st_'+ei+'_'+(k-1)+'_r']||'';save();renderWorkout();}

/* ---------- finish / undo ---------- */
let pendingFinish=null;
function askFinish(){
  const nw=nextWorkout();
  if(!hasAnything(nw)){toast('מלא לפחות שדה אחד לפני סיום');return;}
  pendingFinish=nw;
  document.getElementById('confirmTitle').textContent='לסיים את האימון?';
  document.getElementById('confirmMsg').textContent='האימון יישמר עם תאריך היום ותעבור לאימון הבא.';
  const y=document.getElementById('confirmYes');y.textContent='כן, סיימתי';y.onclick=doFinish;
  document.getElementById('confirmOv').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmOv').classList.remove('show');pendingFinish=null;}
function doFinish(){
  const nw=pendingFinish;closeConfirm();if(!nw)return;
  const entry={
    id:'w'+Date.now(),
    date:todayKey(),
    type:nw.type,
    no:S.totalDone+1,
    ref: nw.type==='strength'?{w:nw.def.w,d:nw.def.d,idx:S.strengthIdx}
        : nw.type==='cond'?{n:nw.def.n,idx:S.condIdx}
        : {},
    title: TYPE_HE[nw.type]||'אימון',
    data:Object.assign({}, S.draft.data)
  };
  S.history.push(entry);
  if(nw.type==='strength')S.strengthIdx=(S.strengthIdx+1)%PROGRAMS.strength.length;
  else if(nw.type==='cond')S.condIdx=(S.condIdx+1)%PROGRAMS.cond.length;
  S.totalDone++;
  S.draft={sig:'',data:{}};
  save();
  confetti();
  setTimeout(()=>{renderWorkout();},250);
}
function undoLast(){
  if(!S.history.length)return;
  document.getElementById('confirmTitle').textContent='לבטל את האימון האחרון?';
  document.getElementById('confirmMsg').textContent='האימון יוסר מההיסטוריה ותחזור אליו כדי לתקן.';
  const y=document.getElementById('confirmYes');y.textContent='כן, בטל';
  y.onclick=()=>{
    closeConfirm();
    const e=S.history.pop();
    S.totalDone=Math.max(0,S.totalDone-1);
    if(e.type==='strength')S.strengthIdx=(S.strengthIdx-1+PROGRAMS.strength.length)%PROGRAMS.strength.length;
    else if(e.type==='cond')S.condIdx=(S.condIdx-1+PROGRAMS.cond.length)%PROGRAMS.cond.length;
    S.draft={sig:nextWorkout().sig,data:e.data||{}};
    save();renderWorkout();
  };
  document.getElementById('confirmOv').classList.add('show');
}

/* ===== CALENDAR TAB ===== */
let calY,calM;
function renderCalendar(){
  const now=new Date();
  if(calY===undefined){calY=now.getFullYear();calM=now.getMonth();}
  const first=new Date(calY,calM,1);
  const start=first.getDay();
  const days=new Date(calY,calM+1,0).getDate();
  const byDate={};
  S.history.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  let h=`<div class="wrap">
    ${brandHeader('לוח שנה')}
    <div class="calhead">
      <button onclick="calNav(-1)">‹</button>
      <div class="m">${MONTHS[calM]} ${calY}</div>
      <button onclick="calNav(1)">›</button>
    </div>
    <div class="dow">${DOW.map(d=>'<div>'+d+'</div>').join('')}</div>
    <div class="cal">`;
  for(let i=0;i<start;i++)h+=`<div class="cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=calY+'-'+pad(calM+1)+'-'+pad(d);
    const evs=byDate[k]||[];
    const isToday=k===todayKey();
    const dots=evs.map(e=>`<span class="dot d-${e.type}"></span>`).join('');
    h+=`<div class="cell ${evs.length?'has':''} ${isToday?'today':''}" ${evs.length?`onclick="openDay('${k}')"`:''}>
      <span class="n">${d}</span><span class="dots">${dots}</span></div>`;
  }
  h+=`</div>
  <div class="card" style="margin-top:16px">
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700">
      <span><span class="dot d-strength"></span> הרמת משקולות</span>
      <span><span class="dot d-cond"></span> סיבולת</span>
      <span><span class="dot d-run"></span> ריצה</span>
      <span><span class="dot d-cf"></span> קרוספיט</span>
    </div>
  </div>
  </div>`;
  app.innerHTML=h;
}
function calNav(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCalendar();}

/* ===== DAY DETAIL SHEET ===== */
function openDay(k){
  const evs=S.history.filter(e=>e.date===k);

function closeSheet(){document.getElementById('sheetOv').classList.remove('show');}
function detailBlock(e){
  let h=`<div class="card" style="margin-bottom:14px">
    ${typeBadge(e.type)}
    <div style="font-size:20px;font-weight:800;margin:10px 0 10px">אימון ${e.no} · ${e.title}</div>`;

      const rows=[];
      for(let k=0;k<20;k++){

    if(e.data.en_time)parts.push('זמן: '+e.data.en_time+' דק׳');
    if(e.data.en_pace)parts.push('קצב: '+esc(e.data.en_pace));
    if(e.data.en_hr)parts.push('דופק: '+e.data.en_hr);

  }else{ // run / crossfit — done from external source, just marked
    if(e.data.ext_note)h+=`<div class="detail-ex"><div class="dn">הערה</div><div class="dl">${esc(e.data.ext_note)}</div></div>`;

/* ===== STATS TAB ===== */
let statScope='week';
function tonnageOf(e){
  let t=0;
  for(const k in e.data){
    let m=k.match(/^st_\d+_\d+_w$/);
    if(m){const b=k.slice(0,-2);t+=(+e.data[k]||0)*(+e.data[b+'_r']||0);}
    m=k.match(/^cf_\d+_w$/);
    if(m){const b=k.slice(0,-2);t+=(+e.data[k]||0)*(+e.data[b+'_r']||0);}
  }
  return t;
}
function inScope(date,scope){
  const t=todayKey();
  if(scope==='today')return date===t;
  if(scope==='week')return weekStartKey(date)===weekStartKey(t);
  if(scope==='month')return date.slice(0,7)===t.slice(0,7);
  return true;
}

    <div class="statgrid">
      <div class="stat"><div class="k">טונאז׳ ${scLabel[statScope]}</div><div class="v">${fmtNum(ton)}<span class="u"> ק״ג</span></div></div>

    <div class="counts">
      <div class="c"><div class="cv" style="color:var(--gold)">${cnt.strength}</div><div class="cl">הרמות</div></div>
      <div class="c"><div class="cv" style="color:var(--sky)">${cnt.cond}</div><div class="cl">סיבולת</div></div>
      <div class="c"><div class="cv" style="color:var(--run)">${cnt.run}</div><div class="cl">ריצה</div></div>
      <div class="c"><div class="cv" style="color:var(--rose)">${cnt.crossfit}</div><div class="cl">קרוספיט</div></div>
    </div>
    <h2 style="font-size:16px;margin:20px 0 10px">טונאז׳ שבועי</h2>
    <div class="card chartwrap">${weeklyChart()}</div>
    <h2 style="font-size:16px;margin:20px 0 10px">גיבוי ונתונים</h2>
    <button class="settingsbtn" onclick="exportData()">⬇ ייצוא גיבוי (JSON)</button>
    <button class="settingsbtn" onclick="document.getElementById('importFile').click()">⬆ ייבוא גיבוי</button>
    <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)">
    <button class="settingsbtn" style="color:var(--rose)" onclick="resetAll()">איפוס כל הנתונים</button>
    <div class="hint">האימון הבא בתור: אימון ${S.totalDone+1}</div>
  </div>`;
  app.innerHTML=h;
}
function setScope(s){statScope=s;renderStats();}
function fmtNum(n){n=Math.round(n);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function weeklyChart(){
  // group tonnage by week start, last 12 weeks with data
  const map={};
  S.history.forEach(e=>{const wk=weekStartKey(e.date);map[wk]=(map[wk]||0)+tonnageOf(e);});
  let weeks=Object.keys(map).sort();
  if(!weeks.length)return `<div class="hint" style="margin:20px 0">אין עדיין נתונים</div>`;
  weeks=weeks.slice(-12);
  const max=Math.max(...weeks.map(w=>map[w]),1);
  const W=Math.max(300,weeks.length*46), H=170, pad=24, bw=30;
  let bars='';
  weeks.forEach((w,i)=>{
    const x=pad+i*((W-pad*2)/weeks.length);
    const bh=(map[w]/max)*(H-46);
    const y=H-26-bh;
    const d=parseKey(w);
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,bh)}" rx="5" fill="var(--gold)"/>`;
    bars+=`<text x="${x+bw/2}" y="${H-10}" fill="var(--dim)" font-size="10" text-anchor="middle">${d.getDate()}/${d.getMonth()+1}</text>`;
    if(map[w]>0)bars+=`<text x="${x+bw/2}" y="${y-5}" fill="var(--txt)" font-size="10" font-weight="700" text-anchor="middle">${Math.round(map[w]/1000*10)/10}t</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg>`;
}

/* ---------- export/import/reset ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='workout-backup-'+todayKey()+'.json';a.click();
  URL.revokeObjectURL(url);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.history))throw 0;S=normalize(Object.assign({},DEFAULT,o));save();toast('הגיבוי יובא ✓');renderStats();}catch(e){toast('קובץ לא תקין');}};
  r.readAsText(f);
}
function resetAll(){
  document.getElementById('confirmTitle').textContent='לאפס הכל?';
  document.getElementById('confirmMsg').textContent='כל ההיסטוריה תימחק ותחזור לאימון 1. מומלץ לייצא גיבוי קודם.';
  const y=document.getElementById('confirmYes');y.textContent='כן, אפס';
  y.onclick=()=>{closeConfirm();S=JSON.parse(JSON.stringify(DEFAULT));save();go('workout');};
  document.getElementById('confirmOv').classList.add('show');
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:12px;font-weight:800;z-index:300;box-shadow:var(--shadow);opacity:0;transition:.2s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1800);
}

/* ---------- confetti ---------- */
let confettiRun=0;
function confetti(){
  const cv=document.getElementById('confetti');if(!cv||!cv.getContext)return;cv.classList.remove('hidden');
  const ctx=cv.getContext('2d');if(!ctx){cv.classList.add('hidden');return;}
  const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=['#F1C93B','#2f9e44','#38bdf8','#fb7185','#fff'];
  const P=[];for(let i=0;i<130;i++)P.push({x:W/2,y:H/3,vx:(Math.random()-.5)*14,vy:Math.random()*-15-4,g:.4+Math.random()*.3,c:cols[i%cols.length],s:6+Math.random()*6,r:Math.random()*6});
  let t=0;const myRun=++confettiRun;
  (function anim(){
    if(myRun!==confettiRun)return;
    ctx.clearRect(0,0,W,H);t++;
    P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(t<90)requestAnimationFrame(anim);else{ctx.clearRect(0,0,W,H);cv.classList.add('hidden');}
  })();
}

/* ---------- init ---------- */
render();
</script>
